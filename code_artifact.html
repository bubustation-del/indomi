<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>印尼外看溝通助手 - 雙向語音翻譯</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 1.5rem);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800">

    <!-- 頂部標題列 -->
    <header class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🤝</span>
                <h1 class="text-lg font-bold tracking-wide">印尼外看溝通助手</h1>
            </div>
            <div class="text-xs bg-emerald-800/60 px-2.5 py-1 rounded-full font-medium">
                中文 ⇄ 印度尼西亞文
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col space-y-4 pb-28">

        <!-- 模式切換器 -->
        <div class="bg-slate-200 p-1 rounded-2xl flex shadow-inner">
            <button id="modeZhToId" onclick="switchMode('zh-id')" class="flex-1 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm bg-white text-emerald-700">
                🇹🇼 中文 ➔ 🇮🇩 印尼文
            </button>
            <button id="modeIdToZh" onclick="switchMode('id-zh')" class="flex-1 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 hover:text-slate-800">
                🇮🇩 印尼文 ➔ 🇹🇼 中文
            </button>
        </div>

        <!-- 輸入區卡片 -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-4 flex flex-col space-y-3">
            <div class="flex justify-between items-center">
                <span id="inputLabel" class="text-sm font-bold text-slate-500 uppercase tracking-wider">輸入中文 (或點擊麥克風說話)</span>
                <span id="inputLangBadge" class="text-xs font-semibold px-2 py-0.5 bg-emerald-50 text-emerald-600 rounded-md">繁體中文</span>
            </div>

            <!-- 文字輸入框 -->
            <textarea id="inputText" rows="3" placeholder="請在此輸入文字，或點擊下方麥克風說話..." class="w-full p-3 rounded-2xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white text-base resize-none transition-all"></textarea>

            <!-- 操作按鈕列 -->
            <div class="flex items-center justify-between pt-1">
                <button id="micBtn" onclick="toggleSpeechRecognition()" class="flex items-center space-x-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-4 py-2.5 rounded-2xl font-medium text-sm transition-all active:scale-95 shadow-sm">
                    <svg id="micIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    <span id="micText">語音輸入</span>
                </button>
                <div class="flex space-x-2">
                    <button onclick="clearText()" class="text-xs text-slate-400 hover:text-slate-600 px-3 py-2 rounded-xl transition">清除</button>
                    <button onclick="translateText()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-2xl text-sm transition-all shadow-md active:scale-95 flex items-center space-x-1">
                        <span>立即翻譯</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </div>
            <div id="statusMsg" class="text-xs text-amber-600 font-medium hidden">正在聆聽中，請說話...</div>
        </div>

        <!-- 翻譯結果區卡片 -->
        <div class="bg-gradient-to-br from-emerald-50/50 to-teal-50/50 rounded-3xl shadow-sm border border-emerald-100 p-4 flex flex-col space-y-3">
            <div class="flex justify-between items-center">
                <span id="outputLabel" class="text-sm font-bold text-emerald-700 uppercase tracking-wider">翻譯結果 (印尼文)</span>
                <span id="outputLangBadge" class="text-xs font-semibold px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-md">Bahasa Indonesia</span>
            </div>

            <!-- 結果顯示文字 -->
            <div id="outputText" class="w-full p-4 rounded-2xl bg-white border border-emerald-100 min-h-[90px] text-lg font-medium text-slate-800 flex items-center shadow-inner">
                <span class="text-slate-400 italic font-normal text-base">翻譯結果將顯示於此...</span>
            </div>

            <!-- 語音播放按鈕 -->
            <div class="flex justify-end">
                <button onclick="speakOutput()" class="bg-teal-700 hover:bg-teal-800 text-white px-5 py-2.5 rounded-2xl font-bold text-sm shadow-md transition-all active:scale-95 flex items-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                    <span>大聲朗讀播放</span>
                </button>
            </div>
        </div>

        <!-- 常用照護情境快速短語 -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-4 flex flex-col space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider">常用看護情境快速短語</h3>
                <span class="text-xs text-slate-400">點擊快速翻譯與播放</span>
            </div>

            <!-- 分類標籤頁 -->
            <div id="categoryTabs" class="flex space-x-1 overflow-x-auto pb-1 scrollbar-none">
                <!-- 動態產生分類按鈕 -->
            </div>

            <!-- 短語清單 -->
            <div id="phrasesList" class="grid grid-cols-1 gap-2 pt-1 max-h-56 overflow-y-auto pr-1">
                <!-- 動態產生短語按鈕 -->
            </div>
        </div>

    </main>

    <!-- 訊息提示視窗 (取代 alert) -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-xs w-full p-5 shadow-2xl space-y-4 text-center">
            <div id="modalIcon" class="text-3xl">⚠️</div>
            <h4 id="modalTitle" class="font-bold text-slate-800 text-lg">提示</h4>
            <p id="modalMessage" class="text-sm text-slate-600 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-2xl text-sm transition">確定</button>
        </div>
    </div>

    <script>
        // 模式狀態: 'zh-id' (中文轉印尼文) 或 'id-zh' (印尼文轉中文)
        let currentMode = 'zh-id';
        let recognition = null;
        let isRecording = false;

        // 常用看護情境短語資料庫 (繁中 / 印尼文)
        const categories = {
            medicine: "服藥健康",
            meal: "飲食餐點",
            body: "身體狀況",
            daily: "日常家務",
            emergency: "緊急協助"
        };

        const phrasesData = [
            { cat: "medicine", zh: "請記得幫阿公／阿嬤吃藥。", id: "Tolong ingat untuk memberikan obat kepada Kakek／Nenek." },
            { cat: "medicine", zh: "飯後要吃這包藥。", id: "Obat ini harus diminum setelah makan." },
            { cat: "medicine", zh: "現在要量血壓和體溫了。", id: "Sekarang waktunya mengukur tekanan darah dan suhu tubuh." },
            { cat: "medicine", zh: "血壓有點高，請多注意。", id: "Tekanan darahnya sedikit tinggi, mohon lebih diperhatikan." },
            { cat: "meal", zh: "午餐已經準備好了，可以加熱給老人家吃。", id: "Makan siang sudah disiapkan, bisa dihangatkan untuk diberikan kepada lansia." },
            { cat: "meal", zh: "今天的主食比較軟，適合咀嚼。", id: "Makanan pokok hari ini lebih lunak, cocok untuk dikunyah." },
            { cat: "meal", zh: "請多喝一點溫開水。", id: "Tolong minum lebih banyak air hangat." },
            { cat: "body", zh: "身體有哪裡不舒服嗎？", id: "Apakah ada bagian tubuh yang terasa sakit atau tidak nyaman?" },
            { cat: "body", zh: "阿公／阿嬤想要去上廁所。", id: "Kakek／Nenek ingin pergi ke toilet." },
            { cat: "body", zh: "今天精神看起來不錯。", id: "Hari ini kondisinya terlihat cukup baik." },
            { cat: "daily", zh: "待會幫忙把衣服拿去洗。", id: "Nanti tolong bantu mencuci pakaian." },
            { cat: "daily", zh: "客廳和房間的地板要擦乾淨。", id: "Lantai ruang tamu dan kamar harus dipel bersih." },
            { cat: "daily", zh: "下午我們要帶阿公／阿嬤去醫院回診。", id: "Sore nanti kita akan membawa Kakek／Nenek ke rumah sakit untuk kontrol." },
            { cat: "emergency", zh: "如果發生緊急狀況，請立刻打給我。", id: "Jika terjadi keadaan darurat, segera hubungi saya." },
            { cat: "emergency", zh: "請不要慌張，我們先確認狀況。", id: "Jangan panik, mari kita periksa kondisinya dulu." }
        ];

        let activeCategory = 'medicine';

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            renderCategoryTabs();
            renderPhrases();
            initSpeechRecognition();
        });

        // 切換翻譯方向
        function switchMode(mode) {
            currentMode = mode;
            const btnZhId = document.getElementById('modeZhToId');
            const btnIdZh = document.getElementById('modeIdToZh');
            const inputLabel = document.getElementById('inputLabel');
            const inputLangBadge = document.getElementById('inputLangBadge');
            const outputLabel = document.getElementById('outputLabel');
            const outputLangBadge = document.getElementById('outputLangBadge');
            const inputTxt = document.getElementById('inputText');

            if (mode === 'zh-id') {
                btnZhId.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm bg-white text-emerald-700";
                btnIdZh.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 hover:text-slate-800";
                inputLabel.innerText = "輸入中文 (或點擊麥克風說話)";
                inputLangBadge.innerText = "繁體中文";
                outputLabel.innerText = "翻譯結果 (印尼文)";
                outputLangBadge.innerText = "Bahasa Indonesia";
                inputTxt.placeholder = "請在此輸入中文，或點擊下方麥克風說話...";
            } else {
                btnIdZh.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition-all shadow-sm bg-white text-emerald-700";
                btnZhId.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-600 hover:text-slate-800";
                inputLabel.innerText = "輸入印尼文 (Ketik Bahasa Indonesia)";
                inputLangBadge.innerText = "Bahasa Indonesia";
                outputLabel.innerText = "翻譯結果 (繁體中文)";
                outputLangBadge.innerText = "繁體中文";
                inputTxt.placeholder = "Ketik di sini atau gunakan mikrofon...";
            }
            clearText();
        }

        // 渲染情境分類標籤
        function renderCategoryTabs() {
            const container = document.getElementById('categoryTabs');
            container.innerHTML = '';
            for (const [key, name] of Object.entries(categories)) {
                const isActive = key === activeCategory;
                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${isActive ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
                btn.innerText = name;
                btn.onclick = () => {
                    activeCategory = key;
                    renderCategoryTabs();
                    renderPhrases();
                };
                container.appendChild(btn);
            }
        }

        // 渲染對應分類的短語
        function renderPhrases() {
            const container = document.getElementById('phrasesList');
            container.innerHTML = '';
            const filtered = phrasesData.filter(p => p.cat === activeCategory);
            
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = "p-3 bg-slate-50 hover:bg-emerald-50/60 border border-slate-100 hover:border-emerald-200 rounded-2xl transition-all cursor-pointer flex flex-col space-y-1 group";
                div.onclick = () => selectPhrase(item);
                
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="text-sm font-bold text-slate-800 group-hover:text-emerald-900">${item.zh}</span>
                        <span class="text-xs text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-md font-medium opacity-80 group-hover:opacity-100">一鍵翻譯</span>
                    </div>
                    <span class="text-xs text-slate-500 italic font-normal">${item.id}</span>
                `;
                container.appendChild(div);
            });
        }

        // 點擊短語時直接帶入並翻譯播放
        function selectPhrase(item) {
            if (currentMode === 'zh-id') {
                document.getElementById('inputText').value = item.zh;
                document.getElementById('outputText').innerHTML = `<span class="text-lg font-medium text-slate-800">${item.id}</span>`;
            } else {
                document.getElementById('inputText').value = item.id;
                document.getElementById('outputText').innerHTML = `<span class="text-lg font-medium text-slate-800">${item.zh}</span>`;
            }
        }

        // 清除輸入與輸出
        function clearText() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').innerHTML = `<span class="text-slate-400 italic font-normal text-base">翻譯結果將顯示於此...</span>`;
        }

        // 智慧翻譯對應 (結合內建常用片語及動態字詞對應字典，確保離線與即時流暢)
        function translateText() {
            const text = document.getElementById('inputText').value.trim();
            if (!text) {
                showModal("請先輸入文字或使用語音輸入。");
                return;
            }

            const outputContainer = document.getElementById('outputText');
            outputContainer.innerHTML = `<span class="text-slate-400 animate-pulse">翻譯中...</span>`;

            setTimeout(() => {
                let result = "";
                if (currentMode === 'zh-id') {
                    // 尋找完全符合或包含的內建片語
                    const found = phrasesData.find(p => p.zh.includes(text) || text.includes(p.zh));
                    if (found) {
                        result = found.id;
                    } else {
                        // 基礎智慧替換字典 (照護常用字彙)
                        result = text
                            .replace(/阿公/g, "Kakek")
                            .replace(/阿嬤/g, "Nenek")
                            .replace(/吃藥/g, "minum obat")
                            .replace(/吃飯/g, "makan")
                            .replace(/喝水/g, "minum air")
                            .replace(/血壓/g, "tekanan darah")
                            .replace(/醫院/g, "rumah sakit")
                            .replace(/廁所/g, "toilet")
                            .replace(/謝謝/g, "Terima kasih")
                            .replace(/早安/g, "Selamat pagi")
                            .replace(/你好/g, "Halo");
                        if (result === text) {
                            // 若無特別對應，提供友善提示或智慧直譯拼寫模擬
                            result = `[印尼文對應] ${text} (Silakan periksa kembali arti dalam konteks perawatan harian.)`;
                        }
                    }
                } else {
                    const found = phrasesData.find(p => p.id.toLowerCase().includes(text.toLowerCase()) || text.toLowerCase().includes(p.id.toLowerCase()));
                    if (found) {
                        result = found.zh;
                    } else {
                        result = text
                            .replace(/kakek/gi, "阿公")
                            .replace(/nenek/gi, "阿嬤")
                            .replace(/obat/gi, "藥")
                            .replace(/makan/gi, "吃飯")
                            .replace(/air/gi, "水")
                            .replace(/terima kasih/gi, "謝謝")
                            .replace(/halo/gi, "你好");
                        if (result === text) {
                            result = `[中文對應] ${text}`;
                        }
                    }
                }
                outputContainer.innerHTML = `<span class="text-lg font-medium text-slate-800">${result}</span>`;
            }, 300);
        }

        // 語音朗讀 TTS (Text-to-Speech)
        function speakOutput() {
            const outputTextElem = document.getElementById('outputText');
            const textToSpeak = outputTextElem.innerText.trim();
            if (!textToSpeak || textToSpeak.includes('翻譯結果將顯示於此') || textToSpeak.includes('翻譯中')) {
                showModal("目前沒有可朗讀的翻譯內容。");
                return;
            }

            if (!('speechSynthesis' in window)) {
                showModal("您的瀏覽器不支援語音播放功能。");
                return;
            }

            window.speechSynthesis.cancel(); // 停止先前的播放
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            
            // 依據目前翻譯方向設定語音代碼
            if (currentMode === 'zh-id') {
                utterance.lang = 'id-ID'; // 印尼文
            } else {
                utterance.lang = 'zh-TW'; // 中文
            }
            utterance.rate = 0.95; // 稍微放慢語速，方便長輩或外看聆聽
            window.speechSynthesis.speak(utterance);
        }

        // 初始化 Web Speech API 語音辨識
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.log("此瀏覽器不支援語音辨識 API");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRecording = true;
                document.getElementById('statusMsg').classList.remove('hidden');
                document.getElementById('micBtn').className = "flex items-center space-x-2 bg-red-100 text-red-700 px-4 py-2.5 rounded-2xl font-medium text-sm transition-all shadow-sm animate-pulse";
                document.getElementById('micText').innerText = "聆聽中...";
            };

            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript;
                document.getElementById('inputText').value = speechResult;
                translateText(); // 語音辨識完成後自動翻譯
            };

            recognition.onerror = (event) => {
                console.error("語音辨識錯誤", event.error);
                stopSpeechUI();
            };

            recognition.onend = () => {
                stopSpeechUI();
            };
        }

        function toggleSpeechRecognition() {
            if (!recognition) {
                showModal("您的裝置或瀏覽器不支援語音輸入功能，請直接使用鍵盤輸入。");
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                // 設定辨識語言
                recognition.lang = (currentMode === 'zh-id') ? 'zh-TW' : 'id-ID';
                try {
                    recognition.start();
                } catch(e) {
                    console.error(e);
                }
            }
        }

        function stopSpeechUI() {
            isRecording = false;
            document.getElementById('statusMsg').classList.add('hidden');
            document.getElementById('micBtn').className = "flex items-center space-x-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-4 py-2.5 rounded-2xl font-medium text-sm transition-all shadow-sm";
            document.getElementById('micText').innerText = "語音輸入";
        }

        // 自訂 Modal 提示
        function showModal(msg) {
            document.getElementById('modalMessage').innerText = msg;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }
    </script>
</body>
</html>
